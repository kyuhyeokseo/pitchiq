# PitchIQ v2 analytics configuration (spec 9.1 / 16.3 starting values).
# These are development heuristics for synthetic play, not validated football
# thresholds. Freeze before holdout evaluation; if changed after looking at
# test results, report on a new split. Change log at the bottom.
version: "analytics-0.1.0"

window:
  state_s: 3.0            # trailing window for lines / marking
  pressure_s: 1.0
  funnel_s: 2.0
  transition_s: 2.0       # after a possession change
phase:
  buildup_max_u_m: 45.0   # ball u (attack frame) below this = buildup, else progression
lines:
  max_spread_m: 12.0
  min_stability: 0.8
  min_group_size: 2
  high_back_depth_m: 40.0
  deep_back_depth_m: 30.0
marking:
  max_mean_distance_m: 5.0
  min_duration_s: 2.0
  relative_speed_weight_s: 0.5
  switch_penalty_m: 2.0
  unmatched_cost_m: 6.0
  moving_attacker_mps: 1.0
  follow_ok_score: 0.4
  max_follow_lag_frames: 3   # defenders may react up to 0.6 s late
  zone_radius_m: 30.0
  man_oriented_min_edges: 4
  man_oriented_min_coverage: 0.6
pressure:
  gate_distance_m: 6.0
  gate_closing_mps: 1.0
  gate_duration_s: 0.6
  contact_distance_m: 2.0
lanes:
  min_length_m: 5.0
  max_length_m: 25.0
  ball_speed_mps: 14.0
  defender_speed_mps: 7.0
  reaction_s: 0.2
  sample_step_m: 2.0
  end_exclusion_m: 1.0
  screened_margin_s: 0.1
  open_margin_s: 0.4
  offside_tolerance_m: 0.3
  central_half_width_m: 12.0
  release_radius_m: 2.5     # defenders this close to the ball count as release pressure, not lane screens ...
  shadow_angle_deg: 25.0    # ... except for lanes within this angle of their position (pressing while cutting)
cover:
  horizon_s: 1.0
  runner_min_forward_mps: 2.5
  runner_max_behind_line_m: 12.0  # runners for behind-space claims start near the line
  runner_min_ahead_of_ball_m: 10.0
  runner_max_from_ball_m: 50.0
  goal_side_tolerance_m: 3.0
  late_cover_margin_s: 0.2      # behind_space_exposed: secondary cover later than this
  isolated_cover_margin_s: 0.5  # isolated_1v1: every cover later than this
regions:
  ahead_from_m: 5.0
  ahead_to_m: 25.0
  v_min_m: 20.0
  v_max_m: 48.0
  receiver_margin_s: 0.3
  low_marking_support: 0.4
  nearest_defender_m: 4.0
claims:
  short_options_min_candidates: 3
  short_options_min_screened: 2
  central_min_candidates: 2
  central_min_screened: 2
  depth_reduced_min_m: 8.0        # behind_depth_reduced: same back line, this much closer to goal
  depth_change_window_s: 6.0
  span_disconnected_m: 35.0       # press_block_disconnected: front-back span
  gap_disconnected_m: 20.0        # ... or mid-back gap
  between_lines_margin_m: 2.0     # a receiver must be this far inside both lines
  overload_min_delta: 1
  buildup_zone_ahead_m: 12.0      # numbers around the ball: outfield players up to this far ahead of it
  rest_zone_ahead_m: 25.0         # numbers further up: players at least this far ahead of the ball
  sustain_s: 1.0              # restricted and context claims
  exposure_sustain_s: 0.6     # exposed claims (runs are short)
changes:
  window_s: 3.0
  attacker_move_m: 5.0            # drop (C) or move into the gap (B) over the window
  defender_step_m: 4.0
  defender_near_m: 6.0
  mid_shift_m: 4.0
  line_step_m: 6.0               # the back line steps up together (G), within depth_change_window_s
episodes:
  activate_s: 1.0
  cooling_s: 1.5
  close_s: 3.0
  new_region_m: 15.0         # a new carrier this far from the episode anchor starts a new episode
  outcome_window_s: 6.0
  novelty_window_s: 15.0
story:
  w_support: 0.35
  w_change: 0.25
  w_ball: 0.25
  w_novelty: 0.15
  min_support: 0.65
  min_priority: 0.6
overlay:
  live_ttl_s: 0.6
  fan_max_elements: 6
  fan_max_labels: 2
  analyst_max_elements: 20
  analyst_max_labels: 5

# change log
# 0.1.0 (2026-10-21): initial values from spec v2 sections 7-10 and 16.3.
