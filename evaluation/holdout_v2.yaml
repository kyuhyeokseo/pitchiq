# Holdout evaluation for the v2 defensive families (spec 16 and 17.2).
# Fixed before the first run. If anything here or in analytics_config.yaml changes after results were seen,
# report it as a new version with new seeds instead of overwriting the old report.
version: holdout-v2-0.11
seeds: [16000, 16011]        # inclusive; new seeds: 5000-5011 (0.1), 7000-7011 (0.2), 8000-8011 (0.3), 9000-9011 (0.4), 10000-10011 (0.5), 11000-11011 (0.6), 12000-12011 (0.7), 13000-13011 (0.8), 14000-14011 (0.9), 15000-15011 (0.10) used; 6000-6011 validation
changes_from_previous:       # what changed after holdout-v2-0.10 was seen (from a second review of the demo clips as a football fan)
  - "generator 0.6: a defender the ball has gone past by 10 m (was 15 m) gets back goal-side of it; the nearest defender engages a free carrier from about 32 m out (danger 0.15, was 0.20); markers stand at least 3.0 m off their man (was 2.4 m); a presser does not cut the pass to a man a team-mate already has; B compact's midfield starts about 10 m in front of its back four (was level with it); G's far centre-back sprints back 26 m toward his box when the striker is through (was 16 m)"
  - "analyzer 0.2: the backward limit for a short option is 6 m (was 8 m: diagonal passes back to a centre-back 7-8 m behind still counted)"
changes_in_0_10:             # what changed after holdout-v2-0.9 was seen (found on the demo clip, seed 7, the development seed)
  - "generator 0.6: in A the striker curves in from outside to cut the pass to the full back, showing the centre-back inside onto the markers (cutting the pass into the pivot made the press read as a central screen, so the space behind could not join its story); a man-marker's leash is 18 m (was 12 m)"
changes_in_0_9:              # what changed after holdout-v2-0.8 was seen (diagnosed on validation seeds 6000-6011 only)
  - "generator 0.6: the keeper rule applies to the defending keeper only (the keeper of the team building up stands where the plan puts him, an option at the back); in 0.7/0.8 it also pulled him to 3 m off his line, lengthening the build-up passes"
  - "generator 0.6: D's left centre-back starts where he did before 0.7 (a wider start lengthened the back pass, so the escape came after the free man's outcome window), and in D escape the keeper plays the free centre-back 0.8-1.1 s after receiving (was 1.2-1.5 s)"
changes_in_0_8:              # what changed after holdout-v2-0.7 was seen
  - "analyzer 0.2: the backward limit for a short option is 8 m (0.7 used 3 m, which also dropped square passes between the centre-backs of a back three and removed D's lane-cut trap on the demo clip; found by a unit test on the demo clips, not by holdout results)"
changes_in_0_7:              # what changed after holdout-v2-0.6 was seen (from a review of the demo clips as a football fan, not from holdout results)
  - "generator 0.6: keepers stay within about 7 m of their line (8 m for a ball in behind); a clip ends 1.6 s after the defending team wins the ball, 3.5 s after the last planned action otherwise"
  - "generator 0.6: the defending team keeps a leash to its formation spots (moved with the ball) and its spacing, the back line holds the edge of its box unless the ball or its man is deeper, the nearest defender engages a free carrier in a dangerous spot (goal-distance danger), a screen skips a man a team-mate already has, markers stand at least 2.4 m off their man"
  - "generator 0.6: linking passes wait (up to 2 s) for a likely lane; pressers mark goal-side until their man has the ball; B's holding midfielder follows the pivot; C's screens stand apart and pick up their men once the ball goes wide, and in C support the centre-back goes back to the keeper; E hold switches over the screen to the far full back; G's near centre-back chases the run and the striker shoots"
  - "analyzer 0.2: a pass more than 3 m back toward the carrier's own goal is not a short option (screened or open)"
changes_in_0_6:              # what changed after holdout-v2-0.5 was seen (diagnosed on validation seeds 6000-6011 only)
  - "generator 0.5: a pass to a runner is never released offside (the trigger allows for the line stepping up), and a ball played into space rolls on until someone reaches it (no reception from 2 m away)"
  - "generator 0.5: in C support the far winger steps into the lane to the far centre-back (left open, that square ball was the free man the support is meant to take away)"
  - "generator 0.5: C's story players shift their feet where they wait and the carrier keeps the ball moving"
  - "definition: D main's story accepts either restriction label (central routes screened or short options screened), as C has since 0.2; the analyzer names it by whichever it sees first on the carrier"
changes_in_0_5:              # what changed after holdout-v2-0.4 was seen (found by the browser walkthrough, not by holdout results)
  - "generator 0.4.1: D's double pivot holds its height and slides across, so its markers stay in the build-up zone (the D trap's 4 v 5 count)"
  - "frontend: overlapping episodes are stacked on separate timeline rows (one bar could cover another and could not be clicked)"
changes_in_0_4:              # what changed after holdout-v2-0.3 was seen (diagnosed on seeds 7, 100-119 and validation 6000-6011)
  - "generator 0.4: in A, the midfield, the ball-far wide midfielder and the far full back (inside only, at the line's height) drop off a man far from the ball (loose marking, slopes from IDSSE); the striker's marker and the second centre-back stay tight"
  - "generator 0.4: C's pivot slides across, C's midfield screen is released once the ball goes wide, E's free man waits at his height before moving into the space"
  - "analyzer: an outcome revision after a turnover no longer pulls in the other team's state (it used to stop the analysis)"

perturb:                     # reaction / spacing combinations outside the development settings
  lag_scale: [0.75, 1.35]    # marker and plan reaction lags
  cushion_scale: [0.85, 1.20] # goal-side marking cushions
  speed_scale: [0.93, 1.07]  # behaviour running speeds
  timing_scale: [0.90, 1.15] # how long a player keeps the ball before the planned pass
  start_jitter_m: 1.0        # start positions (goalkeepers excluded)
matching:
  iou_min: 0.3               # episode vs designed story, same defending team and an accepted family, 1:1
targets:                     # spec 17.2 starting targets: reported against, never assumed
  supported_claim_precision: 0.90
  counter_example_wrong_emphasis: 0
